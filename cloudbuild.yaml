# Cloud Build pipeline for verum.sh.
# Triggered on push to main. Builds the Docker image, pushes to Artifact
# Registry, then deploys to Cloud Run with min-instances=0 so the
# property scales to zero when idle.

substitutions:
  _PROJECT_ID: mae-stack-prod
  _REGION: us-central1
  _SERVICE: verum-sh
  _REPO: verum-sh
  _IMAGE: ${_REGION}-docker.pkg.dev/${_PROJECT_ID}/${_REPO}/${_SERVICE}

steps:
  - name: gcr.io/cloud-builders/docker
    args: ['build', '-t', '${_IMAGE}:${SHORT_SHA}', '-t', '${_IMAGE}:latest', '.']

  - name: gcr.io/cloud-builders/docker
    args: ['push', '--all-tags', '${_IMAGE}']

  - name: gcr.io/google.com/cloudsdktool/cloud-sdk
    entrypoint: gcloud
    args:
      - run
      - deploy
      - ${_SERVICE}
      - --image=${_IMAGE}:${SHORT_SHA}
      - --region=${_REGION}
      - --platform=managed
      - --allow-unauthenticated
      - --min-instances=0
      - --max-instances=10
      - --cpu=1
      - --memory=512Mi
      - --concurrency=80
      - --timeout=60s

options:
  logging: CLOUD_LOGGING_ONLY
  machineType: E2_HIGHCPU_8
