runtime: nodejs22
service: default

# F1 instance: 256MB RAM, 600MHz CPU — plenty for this landing site
instance_class: F1

automatic_scaling:
  target_cpu_utilization: 0.65
  min_instances: 0
  max_instances: 5
  target_throughput_utilization: 0.65
  min_idle_instances: 0
  max_idle_instances: 1
  min_pending_latency: 30ms
  max_pending_latency: 100ms

env_variables:
  NODE_ENV: "production"
  PORT: "8080"

handlers:
  - url: /.*
    script: auto
    secure: always
    redirect_http_response_code: 301

build_env_variables:
  NEXT_TELEMETRY_DISABLED: "1"
