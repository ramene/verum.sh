# Route the apex hostnames (and www) + the Connect subdomains to their GAE services.
# Anything else falls through to the `default` service (verum-sh).
#
# Project: mae-stack-prod
# Services: default (verum.sh), mae-sh, appmaestro-ai, pair-relay, mae-connect
dispatch:
  - url: "mae.sh/*"
    service: mae-sh
  - url: "www.mae.sh/*"
    service: mae-sh
  - url: "appmaestro.ai/*"
    service: appmaestro-ai
  - url: "www.appmaestro.ai/*"
    service: appmaestro-ai
  - url: "relay.verum.sh/*"
    service: pair-relay
  # mae Connect rooms (Phase 4 M1) — meet = room UI, join = invite resolver.
  - url: "meet.mae.sh/*"
    service: mae-connect
  - url: "join.mae.sh/*"
    service: mae-connect
  # karve.ai storefront apps. app.karve.ai was already live in the DEPLOYED
  # dispatch but missing from this file — kept here so a dispatch deploy can
  # never drop it again.
  - url: "app.karve.ai/*"
    service: meal-assembly
  - url: "calm.karve.ai/*"
    service: calm
  # llmfit + filedeposit were live in the DEPLOYED dispatch but missing from this
  # file (same footgun as app.karve.ai) — a dispatch deploy dropped them and they
  # fell through to `default` (verum.sh). Restored 2026-09-01.
  - url: "llmfit.karve.ai/*"
    service: rightsizer
  - url: "filedeposit.com/*"
    service: filedeposit
  - url: "www.filedeposit.com/*"
    service: filedeposit
  # Standalone property landings (static GAE services).
  - url: "mediareserve.com/*"
    service: mediareserve
  - url: "www.mediareserve.com/*"
    service: mediareserve
  - url: "lachlandai.com/*"
    service: lachlandai
  - url: "www.lachlandai.com/*"
    service: lachlandai
  # /proof/* -> dynamic verify service (must precede the catch-all; first-match wins)
  - url: "socialcommons.com/proof/*"
    service: proof
  - url: "www.socialcommons.com/proof/*"
    service: proof
  - url: "socialcommons.com/*"
    service: socialcommons
  - url: "www.socialcommons.com/*"
    service: socialcommons
